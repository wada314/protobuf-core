[package]
name = "protobuf-core"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "A primitive utility library for Protocol Buffers in Rust"
license = "Apache-2.0"
repository = "https://github.com/wada314/protobuf-core"
documentation = "https://docs.rs/protobuf-core/"
readme = "README.md"
exclude = [
    "/.cursor",
    "/.gitignore",
    "/AGENTS.md",
    "/protobuf-core.code-workspace",
]

[features]
# `impl LenBuf for Vec<u8, A>`. Turns on `allocator_api`. Build with a nightly compiler.
nightly = []

[dependencies]
thiserror = "1.0"

[dev-dependencies]
assert_matches = "1.5"
