[package]
name = "protobuf-core"
version = "0.6.0"
edition = "2024"
rust-version = "1.85"
description = "A primitive utility library for Protocol Buffers in Rust"
license = "Apache-2.0"
repository = "https://github.com/wada314/protobuf-core"
documentation = "https://docs.rs/protobuf-core/"
readme = "README.md"
exclude = [
    "/.cursor",
    "/.gitignore",
    "/AGENTS.md",
    "/protobuf-core.code-workspace",
]

[dependencies]
thiserror = "1.0"

[dev-dependencies]
assert_matches = "1.5"

# Explicitly do not inherit a parent workspace's [workspace.lints]
# (e.g. when vendored as a puroro submodule).
[lints.clippy]
# Pedantic by default; keep CamelCase protobuf names backticked in docs.
doc_markdown = "warn"
